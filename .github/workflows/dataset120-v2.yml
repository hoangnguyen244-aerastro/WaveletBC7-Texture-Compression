name: Dataset120 audit and exploratory BC7 experiment
on:
  push:
    branches: [experiment/dataset120-v2-exploratory]
  workflow_dispatch:
    inputs:
      run_exploratory:
        description: 'Run exploratory BC7 on 120 images only after reviewing the dataset audit (not thesis validation)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  dataset-audit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Audit 120 images (capture errors without hiding them)
        shell: pwsh
        run: |
          python -m scripts.validate_dataset --root resources/textures/train/albedo
          if ($LASTEXITCODE -ne 0) { Write-Warning "Dataset validation failed; inspect attached validation_report.json. No scientific conclusion is authorized." }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataset120-audit
          path: |
            datasets/integration/inventory.csv
            datasets/integration/validation_report.json
          retention-days: 30
          if-no-files-found: warn

  exploratory:
    if: github.event_name == 'workflow_dispatch' && inputs.run_exploratory
    needs: dataset-audit
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Prepare exploratory 120-image manifest (NOT independent test)
        run: python -m scripts.prepare_dataset120_exploratory
      - name: BC7 baseline vs fixed vs adaptive
        run: python -m scripts.run_research --config results/experiments/dataset120_exploratory/exploratory_3methods.json
      - name: Generate paired report
        run: python -m scripts.generate_report results/experiments/dataset120_exploratory/comparison_results
      - name: Save numeric measurements, not redistributed images
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $root = 'results/experiments/dataset120_exploratory'
          Copy-Item "$root/READ_ME_FIRST.txt" evidence/ -ErrorAction SilentlyContinue
          foreach ($name in @('raw_results.csv','paired_summary.csv','config.json','environment.json','report.md')) {
            Copy-Item "$root/comparison_results/$name" evidence/ -ErrorAction SilentlyContinue
          }
          if (Test-Path "$root/comparison_results/figures") {
            Copy-Item "$root/comparison_results/figures" evidence/figures -Recurse
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataset120-exploratory-not-thesis-test
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
