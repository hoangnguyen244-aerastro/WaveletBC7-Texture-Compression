name: Research unit tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/test_research.py tests/test_sweep.py -q
      - run: QT_QPA_PLATFORM=offscreen python -c "from desktop.main import Studio; from PySide6.QtWidgets import QApplication; app = QApplication([]); w = Studio(); assert len(w.methods()) > 1; w.close()"
