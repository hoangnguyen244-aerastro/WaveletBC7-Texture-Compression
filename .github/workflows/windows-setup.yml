name: Windows setup smoke test
on:
  push:
    branches: ["feature/research-framework-v1"]
  pull_request:
jobs:
  setup-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install and test
        shell: pwsh
        run: |
          ./setup_windows.ps1
          ./.venv/Scripts/python.exe -c "import PySide6; print(PySide6.__version__)"
